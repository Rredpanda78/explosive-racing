# Explosive Racing 線上房間（cd server && npm run deploy 部署到 Cloudflare）
name = "explosive-racing-rooms"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# 允許連線的網頁（逗號分隔，要完全一樣）。本機開發用 npm run dev（另外允許 localhost）
ALLOWED_ORIGINS = "https://rredpanda78.github.io"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# 免費方案只能用 SQLite 版的 Durable Object
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# 公開房間列表
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]

# 帳號（一個帳號一個物件）與登入嘗試次數的限制
[[durable_objects.bindings]]
name = "ACCOUNT"
class_name = "Account"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Account", "Limiter"]
